<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ラーメンの絵文字</title>
  <desc id="desc">湯気の立つ麺と具材が入った赤いラーメン鉢</desc>

  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f34b47"/>
      <stop offset="1" stop-color="#bd1f2d"/>
    </linearGradient>
    <linearGradient id="broth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a65325"/>
      <stop offset="1" stop-color="#733119"/>
    </linearGradient>
    <linearGradient id="egg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset="1" stop-color="#f3e4bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#5b1720" flood-opacity=".25"/>
    </filter>
    <clipPath id="soupClip">
      <ellipse cx="256" cy="251" rx="181" ry="62"/>
    </clipPath>
  </defs>

  <!-- Chopsticks -->
  <g stroke-linecap="round">
    <path d="M118 68 364 250" stroke="#6b351e" stroke-width="17"/>
    <path d="M146 43 390 226" stroke="#99532d" stroke-width="15"/>
    <path d="M146 43 390 226" stroke="#d88a4a" stroke-width="5" opacity=".5"/>
  </g>

  <!-- Steam -->
  <g fill="none" stroke="#d8dde2" stroke-width="14" stroke-linecap="round">
    <path d="M192 172c-31-23 25-42-4-72-16-17-4-37 12-47"/>
    <path d="M261 161c-29-25 23-43-2-72-14-17-1-35 13-45"/>
    <path d="M326 177c-30-21 25-41-2-68-14-15-4-31 11-41"/>
  </g>

  <!-- Bowl and soup -->
  <g filter="url(#shadow)">
    <path d="M69 250c7 121 66 204 187 204s180-83 187-204Z" fill="url(#bowl)"/>
    <path d="M89 289c14 86 65 144 167 144s153-58 167-144c-39 25-100 39-167 39S128 314 89 289Z"
          fill="#d72f38" opacity=".38"/>
    <ellipse cx="256" cy="251" rx="194" ry="75" fill="#fff5db"/>
    <ellipse cx="256" cy="251" rx="181" ry="62" fill="url(#broth)"/>

    <!-- Noodles and toppings, clipped inside the soup -->
    <g clip-path="url(#soupClip)">
      <g fill="none" stroke="#f6cc55" stroke-width="12" stroke-linecap="round">
        <path d="M70 243c25-34 49 34 74 0s49 34 74 0 49 34 74 0 49 34 74 0 49 34 74 0"/>
        <path d="M69 271c25-34 49 34 74 0s49 34 74 0 49 34 74 0 49 34 74 0 49 34 74 0"/>
        <path d="M85 298c25-34 49 34 74 0s49 34 74 0 49 34 74 0 49 34 74 0"/>
      </g>

      <!-- Chashu -->
      <g transform="rotate(-10 335 235)">
        <ellipse cx="335" cy="235" rx="64" ry="41" fill="#dfa178"/>
        <ellipse cx="335" cy="235" rx="47" ry="28" fill="#f2b793"/>
        <path d="M317 226c13-15 42-7 40 10-2 18-31 22-42 8-7-9-1-18 8-23"
              fill="none" stroke="#c7775b" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- Egg -->
      <g transform="rotate(8 178 235)">
        <ellipse cx="178" cy="235" rx="55" ry="43" fill="url(#egg)"/>
        <ellipse cx="178" cy="238" rx="23" ry="25" fill="#ffae22"/>
        <ellipse cx="171" cy="230" rx="8" ry="7" fill="#ffd663" opacity=".85"/>
      </g>

      <!-- Nori -->
      <path d="m241 186 65 5-8 73-65-6Z" fill="#183c32"/>
      <path d="m249 193 48 4-6 57-48-4Z" fill="#245849"/>

      <!-- Scallions -->
      <g fill="#63a944">
        <ellipse cx="231" cy="270" rx="17" ry="9" transform="rotate(-24 231 270)"/>
        <ellipse cx="272" cy="278" rx="16" ry="8" transform="rotate(21 272 278)"/>
        <ellipse cx="296" cy="252" rx="15" ry="8" transform="rotate(-16 296 252)"/>
        <ellipse cx="208" cy="287" rx="14" ry="7" transform="rotate(18 208 287)"/>
      </g>
    </g>

    <!-- Rim highlight -->
    <ellipse cx="256" cy="251" rx="188" ry="69" fill="none" stroke="#ffeac0" stroke-width="11"/>

    <!-- Bowl decoration -->
    <path d="M130 352h252" fill="none" stroke="#fff0cf" stroke-width="16"/>
    <path d="M155 381h202" fill="none" stroke="#8f1828" stroke-width="8" opacity=".55"/>
    <circle cx="256" cy="365" r="31" fill="#fff0cf"/>
    <path d="m256 342 7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2Z" fill="#d72f38"/>
  </g>
</svg>
