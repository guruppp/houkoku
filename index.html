<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173b33">
    <meta name="description" content="商品の販売数を入力して、報告文を作成できる売上報告ツールです。">
    <title>売上報告ツール</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="styles.css?v=20260831-1">
    <script src="app.js?v=20260831-1" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-deck">
        <header class="app-header">
          <span class="brand-number">SR / 01</span>
          <h1>売上報告<br><em>ツール</em></h1>
        </header>

        <div class="report-meta">
          <label>
            <span>REPORT DATE</span>
            日付
            <input id="report-date" type="date">
          </label>
        </div>

        <div class="count-card">
          <span>入力済み商品</span>
          <p><strong id="copy-count">0</strong><small> 件</small></p>
        </div>

        <div class="total-card" aria-live="polite">
          <span>総額</span>
          <p><strong id="sales-total">0</strong><small> 円</small></p>
        </div>

        <p id="current-menu-label" class="current-menu-label">現在：新商品メニュー表</p>
        <button id="menu-switch-button" class="menu-switch-button" type="button" disabled>旧商品メニュー表に移動</button>
        <a class="effect-page-link" href="effect.html">商品効果早見表に移動</a>
        <button id="calculator-open-button" class="calculator-open-button" type="button" aria-haspopup="dialog" aria-controls="calculator-overlay" disabled>請求額を計算</button>
        <button id="reset-button" class="reset-button" type="button">すべてリセット</button>
      </aside>

      <section class="work-area">
        <header class="work-header">
          <p class="work-note"><span>HOW TO</span> 数字を直接入力、または左右のボタンで調整できます。</p>
        </header>

        <div id="menu-panels" class="menu-panels" aria-live="polite">
          <p class="loading">商品情報を読み込んでいます…</p>
        </div>

        <section class="report-section" aria-labelledby="report-heading">
          <div class="report-actions">
            <div>
              <span>GENERATED MESSAGE</span>
              <h2 id="report-heading">報告文プレビュー</h2>
            </div>
            <div class="copy-action">
              <span id="copy-status" role="status"></span>
              <button id="copy-button" class="copy-button" type="button">報告文をコピー</button>
            </div>
          </div>
          <textarea id="report-output" readonly>ここに報告文が表示されます</textarea>
        </section>

        <footer>
          <span>PRODUCT MASTER</span>
          商品の追加・変更は <code id="product-master-file">products.json</code> で行えます。
        </footer>
      </section>
    </main>

    <div id="calculator-overlay" class="calculator-overlay" hidden>
      <section class="calculator" role="dialog" aria-modal="true" aria-labelledby="calculator-title">
        <header class="calculator-header">
          <div>
            <span>CHECKOUT</span>
            <h2 id="calculator-title">お会計計算</h2>
          </div>
          <button id="calculator-close-button" class="calculator-close-button" type="button" aria-label="お会計計算を閉じる">×</button>
        </header>
        <p id="billing-menu-name" class="billing-menu-name"></p>
        <div id="billing-list" class="billing-list"></div>
        <div class="billing-summary" aria-live="polite">
          <div class="billing-total-area">
            <span>合計</span>
            <button id="billing-total-copy-button" class="billing-total-copy-button" type="button" aria-label="合計金額をコピー">
              <strong><span id="billing-total">0</span><small> 円</small></strong>
            </button>
            <small id="billing-copy-status" class="billing-copy-status" role="status">金額をクリックしてコピー</small>
          </div>
          <div class="billing-summary-actions">
            <button id="billing-clear-button" type="button">数量をすべてクリア</button>
            <button id="billing-apply-button" class="billing-apply-button" type="button" disabled>売り上げ報告に反映</button>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
