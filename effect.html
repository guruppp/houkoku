<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品早見表</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans JP",sans-serif;background:#f5f3ef;color:#222}
header{background:linear-gradient(135deg,#1d1d1d,#493c30);color:#fff;text-align:center;padding:74px 15px 28px}
.back-link{position:fixed;top:14px;left:50%;z-index:1000;width:min(310px,calc(100% - 28px));min-height:48px;padding:0 20px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%);border:2px solid #fff4c9;border-radius:12px;background:#f4cf83;color:#17251f;text-decoration:none;font-size:16px;font-weight:900;box-shadow:0 6px 18px #0007;transition:transform .15s,background .15s}
.back-link:hover{background:#ffe4a8;transform:translateX(-50%) translateY(-1px)}
.back-link:focus-visible{outline:3px solid #fff;outline-offset:3px}
h1{margin:0;font-size:clamp(26px,5vw,42px)}header p{margin:8px 0 0;color:#ddd}
main{max-width:1150px;margin:auto;padding:20px 14px 45px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select{padding:12px 14px;border:1px solid #d8d2ca;border-radius:12px;background:#fff;font-size:15px}input{flex:1;min-width:230px}
.section{margin-top:28px}.section h2{margin:0 0 12px}.count{font-size:13px;color:#777}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}
.card{background:#fff;border:1px solid #e5e0d8;border-radius:16px;padding:17px;box-shadow:0 3px 12px #0001}
.name{font-size:20px;font-weight:800;margin-bottom:10px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{padding:4px 9px;border-radius:999px;background:#eee8df;font-size:12px}.chief{background:#ffe7a8;color:#765400}.all{background:#e4f1e5;color:#356238}
.secret{background:#eadcff;color:#5c318e}.staff{background:#faf8f5;border-radius:10px;padding:9px;margin:8px 0;font-size:13px}
.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #eee;padding:8px 0}.label{color:#777;font-size:13px}.value{text-align:right;font-weight:700}.price{font-size:19px}.effect{line-height:1.6}
.keyword{background:#30243b;color:#fff;border-radius:12px;padding:11px 14px;margin-bottom:14px;display:inline-block;font-weight:700}
.empty{text-align:center;color:#777;padding:30px;display:none}footer{text-align:center;color:#888;font-size:12px;padding:15px}
@media(max-width:520px){header{padding-top:82px}.back-link{top:10px;width:calc(100% - 20px)}.grid{grid-template-columns:1fr}main{padding:15px 10px}}
</style>
</head>
<body>
<header>
  <a class="back-link" href="index.html">← 売上報告ツールに戻る</a>
  <h1>🍜 商品早見表</h1>
  <p>パック・食べ物・ドリンク・裏メニューをかんたん検索</p>
</header>
<main>
<div class="tools">
<input id="q" placeholder="🔎 商品名・効果・販売条件で検索…">
<select id="cat"><option value="all">すべて</option><option value="pack">パック商品</option><option value="food">食べ物</option><option value="drink">ドリンク商品</option><option value="secret">裏メニュー</option></select>
<select id="sort"><option value="default">おすすめ順</option><option value="asc">価格が安い順</option><option value="desc">価格が高い順</option></select>
</div>

<section class="section"><h2>📦 パック商品 <span class="count" id="pc"></span></h2><div class="grid" id="pack"></div></section>
<section class="section"><h2>🍜 食べ物 <span class="count" id="fc"></span></h2><div class="grid" id="food"></div></section>
<section class="section"><h2>🥤 ドリンク商品 <span class="count" id="dc"></span></h2><div class="grid" id="drink"></div></section>
<section class="section"><h2>🔐 裏メニュー <span class="count" id="sc"></span></h2>
<div class="keyword">🔑 合言葉：「デザートください」</div>
<div class="grid" id="secret"></div></section>
<div class="empty" id="empty">該当する商品がありません。</div>
</main>
<footer>※入力された商品情報を整理して表示しています。</footer>

<script>
const items=[
{c:"pack",n:"yo shi　おすすめ4点セット",p:2040000,pt:"204万円",q:"瞑想毎10個",co:"チーフ以上販売",st:"yo shi / 愛辺リル",e:"豪快　麻婆ラーメン×1 / がんばれラーメン×1 / テンペスト×1 / ピエロ6"},
{c:"pack",n:"愛辺リル　おすすめ3点セット",p:210000,pt:"21万円",q:"瞑想毎10個",co:"誰でも",st:"愛辺リル",e:"うさちゃんらーめん×1 / 特製pipiBull×1 / ペスカ×1"},
{c:"pack",n:"茄子なすとん　おすすめ3点セット",p:70000,pt:"7万円",q:"瞑想毎10個",co:"誰でも",st:"茄子なすとん",e:"ゆず香る塩ラーメン×1 / うさちゃんらーめん×1 / 麻薬たまご×1"},
{c:"food",n:"豪快 麻婆ラーメン",p:700000,pt:"70万円",q:"従業員毎30個",co:"チーフ以上販売",e:"アーマーリジェネ回復（大） / アーマー（中）"},
{c:"food",n:"がんばれラーメン",p:550000,pt:"55万円",q:"従業員毎30個",co:"チーフ以上販売",e:"HPリジェネ回復（大） / HP（中）"},
{c:"food",n:"スペシャルラーメン",p:230000,pt:"23万円",q:"従業員毎30個",co:"誰でも",e:"アーマー（中） / HP（中） / 止血"},
{c:"food",n:"ゆず香る塩ラーメン",p:30000,pt:"3万円",q:"従業員毎50個",co:"誰でも",e:"空腹・水分（中）"},
{c:"food",n:"ラーメン頑張れ屋即席麺",p:55000,pt:"5.5万円",q:"従業員毎50個",co:"誰でも",e:"空腹・水分・ストレス（中）"},
{c:"food",n:"うさちゃんらーめん",p:15000,pt:"1.5万円",q:"従業員毎100個",co:"誰でも",e:"ストレス（中）"},
{c:"food",n:"麻薬たまご",p:25000,pt:"2.5万円",q:"従業員毎50個",co:"誰でも",e:"空腹・水分（中） / 酩酊"},
{c:"food",n:"SINらーみょん",p:30000,pt:"3万円",q:"従業員毎50個",co:"誰でも",tag:"移動販売限定商品",e:"空腹・水分（中）"},
{c:"food",n:"ブルソーらーみょん",p:5000,pt:"5,000円",q:"従業員毎50個",co:"誰でも",e:"ストレス（中） / 酩酊2"},
{c:"drink",n:"テンペスト",p:800000,pt:"80万円",q:"従業員毎30個",co:"チーフ以上販売",tag:"RGドリンクシリーズ",e:"スタミナ（最強）"},
{c:"drink",n:"レザン",p:330000,pt:"33万円",q:"従業員毎30個",co:"誰でも",tag:"RGドリンクシリーズ",e:"アーマー（特大）"},
{c:"drink",n:"ペスカ",p:160000,pt:"16万円",q:"従業員毎30個",co:"誰でも",tag:"RGドリンクシリーズ",e:"スタミナ（大）"},
{c:"drink",n:"マーレ",p:60000,pt:"6万円",q:"従業員毎30個",co:"誰でも",tag:"RGドリンクシリーズ",e:"泳ぎ早（特大）"},
{c:"drink",n:"ピエロ",p:3500,pt:"3,500円",q:"従業員毎50個",co:"誰でも",tag:"RGドリンクシリーズ",e:"止血"},
{c:"secret",n:"ちち搾り お手軽三点セット",p:300000,pt:"30万円",q:"瞑想毎上限20個",co:"誰でも",e:"中身：バニラ・ストロベリー・チョコレート"},
{c:"secret",n:"ちち搾り バニラ味",p:100000,pt:"10万円",q:"1人従業員上限20個",co:"誰でも",e:"HP（特大）"},
{c:"secret",n:"ちち搾り ストロベリー味",p:100000,pt:"10万円",q:"1人従業員上限20個",co:"誰でも",e:"空腹・水分（中） / ストレス / HP（小） / 止血"},
{c:"secret",n:"ちち搾り チョコレート味",p:100000,pt:"10万円",q:"1人従業員上限20個",co:"誰でも",e:"HP（小） / アーマー（中）"},
{c:"secret",n:"ちち搾り プリン味",p:950000,pt:"95万円",q:"瞑想毎上限20個",co:"チーフ以上販売可能",e:"アーマーリジェネ回復（特大） / アーマー（中） / HP（大）"}
];
const labels={pack:"パック商品",food:"食べ物",drink:"ドリンク商品",secret:"裏メニュー"};
function card(x){
return `<article class="card"><div class="name">${x.n}</div><div class="badges"><span class="badge">${labels[x.c]}</span>${x.tag?`<span class="badge">${x.tag}</span>`:""}<span class="badge ${x.co.startsWith("チーフ")?"chief":x.c==="secret"?"secret":"all"}">${x.co}</span></div>${x.st?`<div class="staff">👤 販売従業員：${x.st}</div>`:""}<div class="row"><span class="label">販売数</span><span class="value">${x.q}</span></div><div class="row"><span class="label">価格</span><span class="value price">${x.pt}</span></div>${x.e?`<div class="row"><span class="label">効果・内容</span><span class="value effect">${x.e}</span></div>`:""}</article>`
}
function render(){
let q=document.getElementById("q").value.toLowerCase(),c=document.getElementById("cat").value,s=document.getElementById("sort").value;
let a=items.filter(x=>(c==="all"||x.c===c)&&(x.n+" "+x.e+" "+x.co+" "+x.q+" "+(x.st||"")+" "+(x.tag||"")).toLowerCase().includes(q));
if(s==="asc")a.sort((x,y)=>x.p-y.p);if(s==="desc")a.sort((x,y)=>y.p-x.p);
["pack","food","drink","secret"].forEach(k=>{let z=a.filter(x=>x.c===k);document.getElementById(k).innerHTML=z.map(card).join("");document.getElementById(k==="pack"?"pc":k==="food"?"fc":k==="drink"?"dc":"sc").textContent=z.length+"件"});
document.getElementById("empty").style.display=a.length?"none":"block"
}
["q","cat","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));render();
</script>
</body></html>
