<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品早見表</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans JP",sans-serif;background:#f5f3ef;color:#222}
header{position:relative;background:linear-gradient(135deg,#1d1d1d,#493c30);color:#fff;text-align:center;padding:34px 220px}
.back-link{position:fixed;z-index:1000;right:24px;bottom:24px;display:flex;align-items:center;gap:10px;min-height:58px;padding:9px 18px 9px 11px;border:2px solid #f0c66c;border-radius:16px;background:#fff;color:#302b27;text-align:left;text-decoration:none;box-shadow:0 9px 26px #0006;transition:transform .18s ease,background .18s ease}
.back-link:hover{background:#fff4d8;transform:translateY(-2px)}.back-link:focus-visible{outline:3px solid #fff;outline-offset:4px}.back-link-arrow{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#302b27;color:#f0c66c;font-size:21px;font-weight:900}.back-link-text{display:grid;gap:1px}.back-link small{color:#806f5c;font-size:10px;font-weight:800;letter-spacing:.08em}.back-link strong{font-size:14px;white-space:nowrap}
h1{margin:0;font-size:clamp(26px,5vw,42px)}header p{margin:8px 0 0;color:#ddd}
main{max-width:1150px;margin:auto;padding:20px 14px 45px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
select{padding:12px 14px;border:1px solid #d8d2ca;border-radius:12px;background:#fff;font-size:15px}.categories{display:flex;gap:8px;flex-wrap:wrap;flex:1}.catbtn{border:1px solid #d8d2ca;background:#fff;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer}.catbtn:hover{background:#f0ece6}.catbtn.active{background:#302b27;color:#fff;border-color:#302b27}.filter-title{font-size:14px;font-weight:800;margin:14px 0 7px}.effectcats{margin-top:0}.effectcats .catbtn.active{background:#6b4f2f;border-color:#6b4f2f}
.section{margin-top:28px}.section h2{margin:0 0 12px}.count{font-size:13px;color:#777}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}
.card{background:#fff;border:1px solid #e5e0d8;border-radius:16px;padding:17px;box-shadow:0 3px 12px #0001}
.name{font-size:20px;font-weight:800;margin-bottom:10px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{padding:4px 9px;border-radius:999px;background:#eee8df;font-size:12px}.chief{background:#ffe7a8;color:#765400}.all{background:#e4f1e5;color:#356238}
.secret{background:#eadcff;color:#5c318e}.staff{background:#faf8f5;border-radius:10px;padding:9px;margin:8px 0;font-size:13px}
.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #eee;padding:8px 0}.label{color:#777;font-size:13px}.value{text-align:right;font-weight:700}.price{font-size:19px}.effect{line-height:1.6}
.keyword{background:#30243b;color:#fff;border-radius:12px;padding:11px 14px;margin-bottom:14px;display:inline-block;font-weight:700}
.empty{text-align:center;color:#777;padding:30px;display:none}footer{text-align:center;color:#888;font-size:12px;padding:15px}
@media(max-width:760px){header{padding:26px 14px}.back-link{right:10px;bottom:10px;left:10px;width:auto;justify-content:center}.back-link:hover{transform:translateY(-2px)}}
@media(max-width:520px){main{padding:15px 10px 105px}.grid{grid-template-columns:1fr}}
.sortline{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.sortline button{padding:11px 14px;border:1px solid #d8d2ca;border-radius:12px;background:#fff;font-weight:700;cursor:pointer}.sortline button:hover{background:#f0ece6}.packcard{cursor:pointer}.tap{float:right;font-size:11px;font-weight:600;color:#888;margin-top:5px}.packcontents{margin-top:10px;padding:12px;border-radius:10px;background:#f7f3ed;line-height:1.8}.packbody{display:none}.packcard.open .packbody{display:block}.packcard.open .tap{color:#765400}.packcard.open{border-color:#c8a66a}</style>
</head>
<body>
<header>
  <a class="back-link" href="index.html">
    <span class="back-link-arrow" aria-hidden="true">←</span>
    <span class="back-link-text"><small>売上入力画面へ</small><strong>売上報告ツールに戻る</strong></span>
  </a>
  <h1>🍜 商品早見表</h1>
  <p>パック・食べ物・ドリンク・裏メニューをかんたん検索</p>
</header>
<main>
<div class="tools">
<div class="filter-title">商品カテゴリ</div>
<div class="categories productcats">
<button type="button" class="catbtn active" data-cat="all">📋 すべて</button>
<button type="button" class="catbtn" data-cat="pack">📦 パック商品</button>
<button type="button" class="catbtn" data-cat="food">🍜 食べ物</button>
<button type="button" class="catbtn" data-cat="drink">🥤 ドリンク商品</button>
<button type="button" class="catbtn" data-cat="secret">🔐 裏メニュー</button>
</div>
<div class="filter-title">効果（複数選択OK）</div>
<div class="categories effectcats">
<button type="button" class="catbtn" data-effect="HP">❤️ HP</button>
<button type="button" class="catbtn" data-effect="アーマー">🛡️ アーマー</button>
<button type="button" class="catbtn" data-effect="スタミナ">⚡ スタミナ</button>
<button type="button" class="catbtn" data-effect="足早">🏃 足早</button>
<button type="button" class="catbtn" data-effect="泳ぎ早">🏊 泳ぎ早</button>
<button type="button" class="catbtn" data-effect="止血">🩸 止血</button>
<button type="button" class="catbtn" data-effect="空腹">🍖 空腹</button>
<button type="button" class="catbtn" data-effect="水分">💧 水分</button>
<button type="button" class="catbtn" data-effect="ストレス">😌 ストレス</button>
<button type="button" class="catbtn" data-effect="酩酊">😵 酩酊</button>
</div>
<div class="sortline"><select id="sort"><option value="default">おすすめ順</option><option value="asc">価格が安い順</option><option value="desc">価格が高い順</option></select><button type="button" id="clear">選択をリセット</button></div>
</div>
<section class="section"><h2>📦 パック商品 <span class="count" id="pc"></span></h2><div class="grid" id="pack"></div></section>
<section class="section"><h2>🍜 食べ物 <span class="count" id="fc"></span></h2><div class="grid" id="food"></div></section>
<section class="section"><h2>🥤 ドリンク商品 <span class="count" id="dc"></span></h2><div class="grid" id="drink"></div></section>
<section class="section"><h2>🔐 裏メニュー <span class="count" id="sc"></span></h2>
<div class="keyword">🔑 合言葉：「デザートください」</div>
<div class="grid" id="secret"></div></section>
<div class="empty" id="empty">該当する商品がありません。</div>
</main>
<footer>※入力された商品情報を整理して表示しています。</footer>

<script>
const items=[
{c:"pack",n:"おすすめ4点セット",p:2040000,pt:"204万円",q:"瞑想毎10個",co:"チーフ以上販売",st:"yo shi",e:"",contents:"豪快 麻婆ラーメン ×1 / がんばれラーメン ×1 / テンペスト ×1 / ピエロ ×6"},
{c:"pack",n:"おすすめ3点セット",p:210000,pt:"21万円",q:"瞑想毎10個",co:"誰でも",st:"愛辺リル",e:"",contents:"うさちゃんらーめん ×1 / 特製pipiBull ×1 / ペスカ ×1"},
{c:"pack",n:"おすすめ3点セット",p:70000,pt:"7万円",q:"瞑想毎10個",co:"誰でも",st:"茄子なすとん",e:"",contents:"ゆず香る塩ラーメン ×1 / うさちゃんらーめん ×1 / 麻薬たまご ×1"},
{c:"food",n:"豪快 麻婆ラーメン",p:700000,pt:"70万円",q:"従業員毎30個",co:"チーフ以上販売",e:"アーマーリジェネ回復（大） / アーマー（中）"},
{c:"food",n:"がんばれラーメン",p:550000,pt:"55万円",q:"従業員毎30個",co:"チーフ以上販売",e:"HPリジェネ回復（大） / HP（中）"},
{c:"food",n:"スペシャルラーメン",p:230000,pt:"23万円",q:"従業員毎30個",co:"誰でも",e:"アーマー（中） / HP（中） / 止血"},
{c:"food",n:"ゆず香る塩ラーメン",p:30000,pt:"3万円",q:"従業員毎50個",co:"誰でも",e:"空腹・水分（中）"},
{c:"food",n:"ラーメン頑張れ屋即席麺",p:55000,pt:"5.5万円",q:"従業員毎50個",co:"誰でも",e:"空腹・水分・ストレス（中）"},
{c:"food",n:"うさちゃんらーめん",p:15000,pt:"1.5万円",q:"従業員毎100個",co:"誰でも",e:"ストレス（中）"},
{c:"food",n:"麻薬たまご",p:25000,pt:"2.5万円",q:"従業員毎50個",co:"誰でも",e:"空腹・水分（中） / 酩酊"},
{c:"drink",n:"特製pipiBull",p:45000,pt:"4.5万円",q:"従業員毎30個",co:"誰でも",e:"足早（大）"},
{c:"drink",n:"テンペスト",p:800000,pt:"80万円",q:"従業員毎30個",co:"チーフ以上販売",tag:"RGドリンクシリーズ",e:"スタミナ（最強）"},
{c:"drink",n:"レザン",p:330000,pt:"33万円",q:"従業員毎30個",co:"誰でも",tag:"RGドリンクシリーズ",e:"アーマー（特大）"},
{c:"drink",n:"ペスカ",p:160000,pt:"16万円",q:"従業員毎30個",co:"誰でも",tag:"RGドリンクシリーズ",e:"スタミナ（大）"},
{c:"drink",n:"マーレ",p:60000,pt:"6万円",q:"従業員毎30個",co:"誰でも",tag:"RGドリンクシリーズ",e:"泳ぎ早（特大）"},
{c:"drink",n:"ピエロ",p:3500,pt:"3,500円",q:"従業員毎50個",co:"誰でも",tag:"RGドリンクシリーズ",e:"止血"},
{c:"secret",n:"ちち搾り お手軽三点セット",p:300000,pt:"30万円",q:"瞑想毎上限20個",co:"誰でも",e:"中身：バニラ・ストロベリー・チョコレート"},
{c:"secret",n:"ちち搾り バニラ味",p:100000,pt:"10万円",q:"1人従業員上限20個",co:"誰でも",e:"HP（特大）"},
{c:"secret",n:"ちち搾り ストロベリー味",p:100000,pt:"10万円",q:"1人従業員上限20個",co:"誰でも",e:"空腹・水分（中） / ストレス / HP（小） / 止血"},
{c:"secret",n:"ちち搾り チョコレート味",p:100000,pt:"10万円",q:"1人従業員上限20個",co:"誰でも",e:"HP（小） / アーマー（中）"},
{c:"secret",n:"ちち搾り プリン味",p:950000,pt:"95万円",q:"瞑想毎上限20個",co:"チーフ以上販売可能",e:"アーマーリジェネ回復（特大） / アーマー（中） / HP（大）"}
];
const labels={pack:"パック商品",food:"食べ物",drink:"ドリンク商品",secret:"裏メニュー"};
function effectTags(e){
const tags=[
["HP","❤️ HP"],["アーマー","🛡️ アーマー"],["スタミナ","⚡ スタミナ"],
["足早","🏃 足早"],["泳ぎ早","🏊 泳ぎ早"],["止血","🩸 止血"],
["空腹","🍖 空腹"],["水分","💧 水分"],["ストレス","😌 ストレス"],["酩酊","😵 酩酊"]
];
return tags.filter(t=>e.includes(t[0])).map(t=>`<span class="badge">${t[1]}</span>`).join("");
}
function card(x){
const body=`<div class="row"><span class="label">販売数</span><span class="value">${x.q}</span></div><div class="row"><span class="label">価格</span><span class="value price">${x.pt}</span></div>${x.e?`<div class="row"><span class="label">効果</span><span class="value"><div class="badges">${effectTags(x.e)}</div></span></div>`:""}${x.contents?`<div class="packcontents"><b>📋 中身</b><div>${x.contents.replaceAll(" / ","<br>")}</div></div>`:""}`;
return `<article class="card ${x.c==="pack"?"packcard":""}" ${x.c==="pack"?'onclick="this.classList.toggle(\'open\')"':""}><div class="name">${x.n}${x.c==="pack"?'<span class="tap">＋ クリックで中身</span>':""}</div><div class="badges"><span class="badge">${labels[x.c]}</span>${x.tag?`<span class="badge">${x.tag}</span>`:""}<span class="badge ${x.co.startsWith("チーフ")?"chief":x.c==="secret"?"secret":"all"}">${x.co}</span></div>${x.st?`<div class="staff">👤 販売従業員：${x.st}</div>`:""}${x.c==="pack"?`<div class="packbody">${body}</div>`:body}</article>`;
}
function render(){
  const activeCat=document.querySelector(".productcats .catbtn.active");
  const cat=activeCat ? activeCat.dataset.cat : "all";
  const effects=[...document.querySelectorAll(".effectcats .catbtn.active")].map(b=>b.dataset.effect);
  const sort=document.getElementById("sort").value;
  let list=items.filter(x=>{
    if(cat!=="all" && x.c!==cat) return false;
    return effects.every(e=>String(x.e||"").includes(e));
  });
  if(sort==="asc") list.sort((a,b)=>a.p-b.p);
  if(sort==="desc") list.sort((a,b)=>b.p-a.p);
  ["pack","food","drink","secret"].forEach(k=>{
    const z=list.filter(x=>x.c===k);
    document.getElementById(k).innerHTML=z.map(card).join("");
    const id=k==="pack"?"pc":k==="food"?"fc":k==="drink"?"dc":"sc";
    document.getElementById(id).textContent=z.length+"件";
  });
  document.getElementById("empty").style.display=list.length?"none":"block";
}
document.querySelectorAll(".productcats .catbtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".productcats .catbtn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});
document.querySelectorAll(".effectcats .catbtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    btn.classList.toggle("active");
    render();
  });
});
document.getElementById("sort").addEventListener("change",render);
document.getElementById("clear").addEventListener("click",()=>{
  document.querySelectorAll(".productcats .catbtn").forEach(b=>b.classList.remove("active"));
  document.querySelector('.productcats .catbtn[data-cat="all"]').classList.add("active");
  document.querySelectorAll(".effectcats .catbtn").forEach(b=>b.classList.remove("active"));
  document.getElementById("sort").value="default";
  render();
});
render();
</script>
</body></html>
